server:
  host: 0.0.0.0
  port: 8080

receiver:
  sourceName: ""
  audioEnabled: false
  scaleMode: contain
  bandwidthMode: highest
  colorFormat: fastest
  outputFpsCap: 0
  lowLatencyMode: true
  autoStart: false
  reconnect:
    enabled: true
    initialDelayMs: 1000
    maxDelayMs: 15000
    backoffMultiplier: 1.8

logging:
  level: info
  maxFiles: 5
  maxSizeMb: 20
  json: false

display:
  fullscreen: true
  hdmiOutputHint: auto
  outputMode: auto

device:
  name: ndi-monitor-pi5
